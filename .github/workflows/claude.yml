# On-demand Claude Code assistant: mention @claude in an issue, PR comment or
# review to get a CI failure diagnosed, a question about the codebase
# answered, or a fix implemented and pushed to the PR branch.
#
# Automatic PR review is intentionally not configured here: CodeRabbit already
# reviews every pull request, and a second automatic reviewer would duplicate
# it. This workflow only runs when a maintainer asks.
#
# Trust model (public repo): only the owner, org members and collaborators can
# trigger it, so drive-by comments cannot spend the OAuth token or steer the
# agent; fork PRs are refused outright.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      || (github.event_name == 'pull_request_review'
        && contains(github.event.review.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
      || (github.event_name == 'issues'
        && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Same toolchain and kernel setup as CI, so Claude can build and run the
      # test suite to verify a fix before pushing it.
      - uses: ./.github/actions/setup-virmux
        with:
          compiler: clang

      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allow_fork_prs: "false"
          # Lets Claude read workflow run logs when asked why CI failed.
          additional_permissions: |
            actions: read
          claude_args: >-
            --allowedTools "Bash(meson setup:*),Bash(meson test:*),Bash(meson compile:*),Bash(ninja:*),Bash(clang-format:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*)"
