name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Formatting (clang-format)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pin the PyPI clang-format wheel to the same version used locally
      # (`uv tool install clang-format==23.1.3`). The apt package on
      # ubuntu-24.04 is v18, which rejects newer .clang-format keys and
      # formats braced initializers (`struct pollfd pfd{};`) differently.
      - name: Install clang-format
        run: pipx install clang-format==23.1.3

      - name: Run clang-format check
        run: |
          find src include cli tests -name '*.cpp' -o -name '*.hpp' -o -name '*.c' -o -name '*.h' | \
            grep -v "tests/unity" | \
            xargs clang-format --dry-run --Werror

  test:
    name: Build & Test (${{ matrix.os }} / ${{ matrix.compiler.cc }} / ${{ matrix.buildtype }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        compiler:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
        buildtype: [release, debug]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            ccache \
            python3 \
            util-linux \
            libncurses-dev \
            libncursesw5-dev \
            ${{ matrix.compiler.cc == 'clang' && 'clang' || '' }}

      - name: Configure runner kernel prerequisites
        run: |
          # Enable unprivileged user namespaces on Ubuntu 24.04 (AppArmor restriction)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          # Ensure unprivileged user namespace clone is permitted
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true
          # Grant cgroups v2 write permissions if mounted
          sudo chmod -R a+rw /sys/fs/cgroup 2>/dev/null || true

      - name: System diagnostic check
        run: bash scripts/doctor.sh

      - name: Configure Meson build
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          meson setup build \
            --buildtype=${{ matrix.buildtype }} \
            -Dwarning_level=3 \
            -Dwerror=true

      - name: Compile targets
        run: ninja -C build

      - name: Run test suite
        run: meson test -C build --verbose --print-errorlogs

      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-24.04' && matrix.buildtype == 'release' && matrix.compiler.cc == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: virmux-binaries
          path: |
            build/virmux
            build/libvirmux_intercept.so
          retention-days: 7
