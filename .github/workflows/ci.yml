# Build and test virmux everywhere it is expected to run.
#
# - test:     every supported Ubuntu LTS x compiler x build type on x86_64,
#             plus arm64. The LD_PRELOAD interceptor issues raw syscalls
#             (SYS_openat, SYS_mmap, SYS_execve) whose numbers and argument
#             conventions are architecture-specific, so arm64 must be tested
#             natively, not assumed.
# - bleeding: newest GCC/Clang from Fedora with -Werror. New compiler
#             releases add warnings (e.g. glibc FORTIFY unused-result) that
#             would otherwise first surface on users' rolling-release distros.
# - coverage: line/branch coverage of src/ published to the job summary, so
#             reviewers can see which paths a change leaves untested.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.compiler.cc }} / ${{ matrix.buildtype }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        compiler:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
        buildtype: [release, debug]
        include:
          - os: ubuntu-24.04-arm
            compiler: { cc: gcc, cxx: g++ }
            buildtype: release
          - os: ubuntu-24.04-arm
            compiler: { cc: clang, cxx: clang++ }
            buildtype: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-virmux
        with:
          compiler: ${{ matrix.compiler.cc }}

      - name: Configure
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
          BUILDTYPE: ${{ matrix.buildtype }}
        run: meson setup build --buildtype="$BUILDTYPE" -Dwarning_level=3 -Dwerror=true

      - name: Build
        run: ninja -C build

      - name: Test
        run: meson test -C build --print-errorlogs

      # Lets reviewers download and try a pull request's build directly.
      - name: Upload binaries
        # One upload per architecture; 22.04 would duplicate the x86_64 name.
        if: matrix.buildtype == 'release' && matrix.compiler.cc == 'gcc' && matrix.os != 'ubuntu-22.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virmux-${{ runner.arch }}
          path: |
            build/virmux
            build/libvirmux_intercept.so
          retention-days: 7

  bleeding:
    name: fedora-latest / ${{ matrix.compiler.cc }} (newest toolchain)
    runs-on: ubuntu-24.04
    # --privileged lets the sandbox create user namespaces and overlay mounts;
    # a tmpfs /tmp avoids stacking overlayfs on the container's own overlay
    # root, and doubles as coverage for distros whose /tmp is tmpfs.
    container:
      image: fedora:latest
      options: --privileged --tmpfs /tmp:exec
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }
    steps:
      # The host's AppArmor userns restriction also applies to unconfined
      # privileged containers; as real root here, lift it like the
      # setup-virmux action does on the bare runners.
      - name: Allow unprivileged user namespaces
        run: |
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$f" ]; then echo 0 > "$f"; fi

      - name: Install toolchain
        run: |
          dnf install -y -q git gcc-c++ clang meson ninja-build ncurses-devel util-linux
          g++ --version | head -1
          clang++ --version | head -1
          # virmux targets unprivileged users and several tests assert that
          # privileged operations fail, so tests must not run as root.
          useradd --create-home builder

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test as an unprivileged user
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          chown -R builder .
          setpriv --reuid=builder --regid=builder --init-groups --reset-env \
            env CC="$CC" CXX="$CXX" bash -euo pipefail -c '
              meson setup build --buildtype=release -Dwarning_level=3 -Dwerror=true
              ninja -C build
              meson test -C build --print-errorlogs
            '

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-virmux

      - name: Install gcovr
        run: pipx install gcovr==8.7

      - name: Configure with coverage instrumentation
        run: meson setup build --buildtype=debug -Db_coverage=true

      - name: Build
        run: ninja -C build

      - name: Test
        run: meson test -C build --print-errorlogs

      - name: Generate coverage report
        run: |
          mkdir -p coverage
          gcovr --root . --object-directory build \
            --filter 'src/' --filter 'include/' \
            --exclude-unreachable-branches --exclude-throw-branches \
            --txt-summary \
            --html-details coverage/index.html \
            --markdown coverage/summary.md \
            --markdown-title "Coverage" \
            --markdown-summary
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
