# Coverage-guided fuzzing of every parser that consumes untrusted bytes:
# IPC frames and daemon request payloads arriving on the supervisor's Unix
# socket, session-list replies a client reads back (the /tmp socket fallback
# can be squatted), benchmark report JSON and CLI size arguments. A crash in
# these paths can take down the supervisor that every sandbox depends on.
#
# - Pull requests: replay the checked-in corpus, then fuzz each target for
#   2 minutes so new parsing bugs are caught before merge.
# - Nightly: fuzz each target for 15 minutes, continuing from the corpus grown
#   by previous nights (kept minimized in the Actions cache).
# Crash, leak and timeout reproducers are uploaded as artifacts; add them to
# tests/fuzz/corpus/<target>/ as regress_* files when fixing the bug.
name: Fuzz

on:
  push:
    branches: [main]
    paths: &fuzz-paths
      - "src/**"
      - "include/**"
      - "tests/fuzz/**"
      - "meson.build"
      - "meson_options.txt"
      - ".github/workflows/fuzz.yml"
  pull_request:
    paths: *fuzz-paths
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing time per target, in seconds
        type: number
        default: 900

permissions:
  contents: read

# Scheduled runs get their own group and are never cancelled, so a push to
# main cannot abort the long nightly/weekly analysis.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  targets:
    name: Discover fuzz targets
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: |
          targets=$(find tests/fuzz -maxdepth 1 -name 'fuzz_*.cpp' -printf '%f\n' |
            sed -E 's/^fuzz_(.*)\.cpp$/\1/' | sort | jq -Rcn '[inputs]')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    name: ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
      SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && 120 || github.event_name == 'push' && 120 || inputs.seconds || 900 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-virmux
        with:
          compiler: clang
          extra-packages: libclang-rt-18-dev

      - name: Build fuzz targets
        env:
          CC: clang
          CXX: clang++
        run: |
          meson setup build -Dfuzzing=true \
            -Db_sanitize=address,undefined -Db_lundef=false \
            -Dwarning_level=3 -Dwerror=true
          ninja -C build "fuzz_${TARGET}"

      - name: Replay checked-in corpus
        run: '"./build/fuzz_${TARGET}" -runs=0 "tests/fuzz/corpus/${TARGET}"'

      - name: Restore accumulated corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus-cache/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # The first corpus directory receives new inputs, so the checked-in
      # seeds under tests/ are never modified.
      - name: Fuzz for ${{ env.SECONDS_PER_TARGET }}s
        run: |
          mkdir -p "corpus-cache/${TARGET}" artifacts
          "./build/fuzz_${TARGET}" \
            -max_total_time="${SECONDS_PER_TARGET}" \
            -timeout=10 -rss_limit_mb=2048 -print_final_stats=1 \
            -artifact_prefix=artifacts/ \
            "corpus-cache/${TARGET}" "tests/fuzz/corpus/${TARGET}"

      - name: Minimize corpus
        if: success() && github.event_name != 'pull_request'
        run: |
          mkdir -p minimized
          "./build/fuzz_${TARGET}" -merge=1 minimized "corpus-cache/${TARGET}"
          rm -rf "corpus-cache/${TARGET}"
          mv minimized "corpus-cache/${TARGET}"

      - name: Save accumulated corpus
        if: success() && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus-cache/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-reproducers-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
