# Static checks that need no running kernel features.
#
# Kept separate from ci.yml so a style nit never hides a real build or test
# failure: every job here runs in parallel with the build matrix instead of
# gating it.
#
# Tool versions are pinned to what developers run locally (see
# CONTRIBUTING.md) because clang-format and clang-tidy output changes between
# releases.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLANG_TOOLS_VERSION: "23.1.3"

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang-format
        run: pipx install "clang-format==${CLANG_TOOLS_VERSION}"

      - name: Check formatting
        run: |
          git ls-files -z '*.c' '*.cpp' '*.h' '*.hpp' ':!:tests/unity/**' |
            xargs -0 clang-format --dry-run --Werror

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-virmux
        with:
          compiler: clang

      - name: Install clang-tidy
        run: pipx install "clang-tidy==${CLANG_TOOLS_VERSION}"

      - name: Generate compilation database
        env:
          CC: clang
          CXX: clang++
        run: meson setup build-tidy

      - name: Run clang-tidy
        run: >-
          run-clang-tidy.py -p build-tidy -quiet
          '^(?!.*/tests/unity/).*/(src|cli|tests)/.*\.(c|cpp)$'

  markdown:
    name: markdownlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint:md

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The official image bundles shellcheck, so `run:` scripts are linted too.
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
