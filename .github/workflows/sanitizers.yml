# Run the full test suite under Clang's runtime sanitizers.
#
# - address+undefined: memory errors and UB in the C/C++ core and the
#   LD_PRELOAD interceptor. UBSan only *reports* by default; halt_on_error
#   makes any UB finding fail the job instead of scrolling past in the log.
# - thread: the supervisor daemon, telemetry sampler and session manager share
#   state across threads and fork() worker processes, so data races and
#   unsafe fork-after-threads patterns are checked on every change.
name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            sanitize: address,undefined
          - name: TSan
            sanitize: thread
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-virmux
        with:
          compiler: clang

      - name: Configure
        env:
          CC: clang
          CXX: clang++
          SANITIZE: ${{ matrix.sanitize }}
        run: |
          meson setup build \
            -Db_sanitize="$SANITIZE" \
            -Db_lundef=false \
            -Dwarning_level=3 \
            -Dwerror=true

      - name: Build
        run: ninja -C build

      - name: Test
        run: meson test -C build --print-errorlogs
