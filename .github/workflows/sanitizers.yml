name: Sanitizers

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitizer:
    name: Clang Address & Undefined Sanitizer (ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            meson \
            ninja-build \
            ccache \
            python3 \
            util-linux \
            libncurses-dev \
            libncursesw5-dev

      - name: Configure runner kernel prerequisites
        run: |
          # Enable unprivileged user namespaces on Ubuntu 24.04 (AppArmor restriction)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          # Ensure unprivileged user namespace clone is permitted
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true
          # Grant cgroups v2 write permissions if mounted
          sudo chmod -R a+rw /sys/fs/cgroup 2>/dev/null || true

      - name: Configure Meson with ASan / UBSan
        env:
          CC: clang
          CXX: clang++
        run: |
          meson setup build-asan \
            -Db_sanitize=address,undefined \
            -Dwarning_level=3 \
            -Dwerror=true

      - name: Compile with Sanitizers
        run: ninja -C build-asan

      - name: Run Test Suite with Sanitizers
        run: meson test -C build-asan --verbose --print-errorlogs
